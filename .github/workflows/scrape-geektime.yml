name: Scrape Geektime Funding RSS

on:
  schedule:
    - cron: '0 2 * * *'  # 2:00 AM UTC — 2h buffer before the 4:03 UTC venture digest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Geektime funding RSS feed
        run: |
          curl -sL -A 'Mozilla/5.0' 'https://www.geektime.co.il/category/funding/feed/' -o data/geektime-funding.xml
          echo "Feed fetched at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/last-updated.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update Geektime funding feed $(date -u +%Y-%m-%d)"
          git push
